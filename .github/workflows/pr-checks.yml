name: PR Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  nix-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Verify flake configuration
        run: nix develop -c nix flake check . --all-systems

      - name: Lint Nix code with Alejandra
        run: nix develop -c alejandra --check .

  npm-checks:
    needs: nix-checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Detect pi changes
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            pi:
              - 'pi/**'

      - name: Install NPM dependencies
        if: steps.filter.outputs.pi == 'true'
        run: nix develop -c bash -c "npm ci"

      - name: Type check
        if: steps.filter.outputs.pi == 'true'
        run: nix develop -c bash -c "npm run check"

      - name: Run tests
        if: steps.filter.outputs.pi == 'true'
        run: nix develop -c bash -c "npm test"
