name: Pi Checks

# See nix-checks.yml for why this is `pull_request_target` and not `pull_request`.
on:
  push:
    branches:
      - development
    paths:
      - "pi/**"
  pull_request_target:
    paths:
      - "pi/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pi-checks:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true

      # `nix develop -c` runs the devshell hook. That hook must not `cd`.
      - name: Install, typecheck, and test
        run: nix develop -c bash -c 'npm ci --prefix pi && npm --prefix pi run check && npm --prefix pi test'
