name: Pi Checks

on:
  push:
    branches:
      - development
    paths:
      - "pi/**"
  pull_request:
    paths:
      - "pi/**"
  workflow_dispatch:

jobs:
  pi-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Install NPM dependencies
        run: devenv shell -c "cd pi && npm ci"

      - name: Type check
        run: devenv shell -c "cd pi && npm run check"

      - name: Run tests
        run: devenv shell -c "cd pi && npm test"
