name: Generate Stow Branch

# No pull_request trigger. contents: write is on this job, and the job only
# runs for a push to the default branch or a manual dispatch.
on:
  push:
    branches: [development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-stow:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/development')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout development
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Build stow tree
        run: |
          nix build .#stow-tree --out-link ./result
          mkdir -p home
          cp -rL ./result/. home/
          chmod -R +w home/

      - name: Commit to stow branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git show-ref --verify --quiet refs/heads/stow; then
            git checkout stow
          else
            git checkout --orphan stow
            git rm -rf .
          fi

          find . -mindepth 1 -not -path './.git/*' -not -name '.git' -not -path './home/*' -not -name 'home' -delete

          cp -r home/. .
          rm -rf home

          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Update stow tree from development ($(git rev-parse --short HEAD))"

      - name: Push stow branch
        run: git push origin stow --force
