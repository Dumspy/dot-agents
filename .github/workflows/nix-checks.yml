name: Nix Checks

on:
  push:
    branches:
      - development
  pull_request:
  workflow_dispatch:

jobs:
  nix-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v16
        with:
          name: devenv

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Verify flake configuration
        run: nix flake check . --all-systems

      - name: Build pi-node-modules (catches fixed-output hash mismatches)
        run: nix build .#pi-node-modules

      - name: Build devenv shell and run git hooks
        run: devenv test
