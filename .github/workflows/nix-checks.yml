name: Nix Checks

# Fork PRs are held by the repo setting "Require approval for all external
# contributors". The job `if` is defence in depth for any run that does start.
# `pull_request` (not `pull_request_target`) keeps the token and cache in the
# PR scope.
on:
  push:
    branches:
      - development
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nix-checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
        with:
          extra_nix_config: |
            keep-env-derivations = true
            keep-outputs = true

      - name: Check flake
        run: nix flake check --all-systems --no-update-lock-file

      - name: Check Nix formatting
        run: nix run .#formatter.x86_64-linux -- --check .
